name: vd-build

on:
  workflow_dispatch:
  push:
    branches: [ feature/virtual-display, feature/system-rules ]

env:
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'   # go.mod wants 1.25.5; toolchain auto-download covers it

      - name: Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/ct.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1"

      - name: rclone.aar
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          bash deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Gradle build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: |
          echo "sdk.dir=$ANDROID_HOME" > src/android/local.properties
          cd src/android
          ./gradlew --no-daemon :app:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          find src/android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist/


      - name: Publish release (in-app update protocol, tag 1.16-beta.9)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find dist -name '*.apk' | head -1)
          out="MinisApp-1.16-beta.9-build47-arm64-v8a.apk"
          cp "$apk" "$out"
          if gh release view 1.16-beta.9 >/dev/null 2>&1; then
            gh release upload 1.16-beta.9 "$out" --clobber
          else
            gh release create 1.16-beta.9 --prerelease \
              --title "Minis 1.16-beta.9 (build 47, full-feature)" \
              --notes "Rolling full-feature build: in-process virtual display + M1 Shizuku shell-host fallback + live capsule preview + system rules (ON by default, execution rules preset) + dark dynamic-island notification + sandbox rootfs assets. Beta-channel in-app 'check update' picks this up (1.16-beta.9 > 1.16-beta.8, build 47 > 46)." "$out"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: openminis-vd-debug
          path: dist/
