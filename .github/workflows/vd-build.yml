name: vd-build

on:
  workflow_dispatch:
  push:
    branches: [ feature/virtual-display, feature/system-rules ]

env:
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  # Fork-only CI test key (committed): runner-generated debug keystores are
  # unique per runner, so consecutive builds sign differently and `pm install -r`
  # over the installed .vd app fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
  # One shared key makes every .vd debug build update in place.
  MINIS_CI_KEYSTORE: ${{ github.workspace }}/ci-keys/vd-test.keystore
  MINIS_CI_KEYSTORE_PASS: minis-vd-test
  MINIS_CI_KEY_ALIAS: minis-vd-test
  MINIS_CI_KEYPASS: minis-vd-test

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'   # go.mod wants 1.25.5; toolchain auto-download covers it

      - name: Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/ct.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1"

      - name: rclone.aar
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          bash deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: PRoot (libproot.so + proot asset)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: |
          # RootfsManager expects libproot.so in the APK's lib/<abi>/ (extracted
          # to nativeLibraryDir at install). It is a build artifact, not a
          # tracked file — without this step the APK ships only the loaders
          # and PRoot dies with "PRoot binary not found" → every shell
          # command fails, virtual display can't run its CLI.
          rm -rf deps/proot
          git clone --depth 1 https://github.com/OpenMinis/proot deps/proot
          bash deps/build_proot.sh
          ls -la src/android/app/src/main/jniLibs/arm64-v8a/
          ls -la src/android/app/src/main/assets/proot-aarch64

      - name: Gradle build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: |
          echo "sdk.dir=$ANDROID_HOME" > src/android/local.properties
          cd src/android
          # perf variant: the debug variant minus android:debuggable. A
          # debuggable app is run interpreter+JIT by ART (it refuses AOT),
          # so keyboard/IME pop and UI transitions feel laggy vs the release
          # main app. perf keeps DEV_TOOLS + the .vd suffix + the same CI
          # signing key (in-place update), but is AOT-compilable and fast.
          ./gradlew --no-daemon :app:assemblePerf

      - name: Collect APKs
        run: |
          mkdir -p dist
          find src/android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist/


      - name: Publish release (in-app update protocol, tag 1.27)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find dist -name '*.apk' | head -1)
          out="MinisApp-1.27-build58-arm64-v8a.apk"
          cp "$apk" "$out"
          if gh release view 1.27 >/dev/null 2>&1; then
            gh release upload 1.27 "$out" --clobber
          else
            gh release create 1.27 \
              --title "Minis 1.27 (build 58, SubAgentPill + session-bound capsule + repin fix)" \
              --notes "New: SubAgentPill pinned at chat top (model info + timer + pause), virtual display capsule session-bound, moveTask am fallback (repin works in shell mode), visibleOnMainScreen fixed, 8 reflection type fixes, P2 batch (text errEnvelope, a11y recycle, cold-restart guard, taskId refresh). Perf build; in-place update over 1.26." "$out"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: openminis-vd-debug
          path: dist/
